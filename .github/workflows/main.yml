name: CI/CD Docker Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔐 Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 🧱 Build Backend Image
      - name: Build Backend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sales-backend:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/sales-backend:latest

      # 🧱 Build Frontend Image
      - name: Build Frontend
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=http://185.222.242.244:8080 \
            -t ${{ secrets.DOCKER_USERNAME }}/sales-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/sales-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/app
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            docker compose pull
            docker compose up -d
