name: CI/CD Docker Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔐 Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 🧱 Build Backend Image
      - name: Build Backend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sales-backend:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/sales-backend:latest

      # 🧱 Build Frontend Image
      - name: Build Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sales-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/sales-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            docker pull ${{ secrets.DOCKER_USERNAME }}/sales-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/sales-frontend:latest

            docker stop backend || true
            docker stop frontend || true

            docker rm backend || true
            docker rm frontend || true

            docker run -d --name backend -p 8080:8080 \
              -e SPRING_DATASOURCE_URL="jdbc:mysql://mysql:3306/sales_db?allowPublicKeyRetrieval=true&useSSL=false" \
              -e SPRING_DATASOURCE_USERNAME=root \
              -e SPRING_DATASOURCE_PASSWORD="@123" \
              ${{ secrets.DOCKER_USERNAME }}/sales-backend:latest

            docker run -d --name frontend -p 3000:80 \
              ${{ secrets.DOCKER_USERNAME }}/sales-frontend:latest
